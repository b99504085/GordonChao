<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trial Balloon</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app" class="shell"></main>

    <template id="gameTemplate">
      <section class="topbar">
        <div>
          <p class="eyebrow" data-i18n="roomLabel">Room</p>
          <strong data-room-code></strong>
        </div>
        <div>
          <p class="eyebrow" data-i18n="roundLabel">Round</p>
          <strong data-round></strong>
        </div>
        <button type="button" class="secondary leave-button" data-leave-button></button>
      </section>

      <section class="panel compact" data-lobby hidden>
        <h2 data-i18n="lobbyTitle"></h2>
        <p class="muted" data-i18n="lobbyBody"></p>
        <div class="players" data-player-list></div>
        <div class="lobby-chat">
          <h3 data-i18n="chatTitle"></h3>
          <div class="chat-messages" data-chat-messages></div>
          <form class="chat-form" data-chat-form>
            <input data-chat-input maxlength="180" autocomplete="off" />
            <button type="submit" data-i18n="sendChat"></button>
          </form>
        </div>
        <button data-start-button hidden></button>
      </section>

      <section class="panel compact" data-game hidden>
        <div class="phase-chip" data-phase></div>
        <h2 data-question></h2>
        <div class="role-card" data-role-card></div>
        <div class="options" data-options></div>
        <button type="button" class="secondary" data-skip-question hidden></button>
        <button data-lock-button hidden></button>
        <p class="muted" data-lock-status></p>
      </section>

      <section class="panel compact" data-results hidden>
        <h2 data-i18n="resultsTitle"></h2>
        <div class="winner-board" data-winner-board hidden></div>
        <div class="counts" data-counts></div>
        <div class="results-list" data-results-list></div>
        <div class="score-board" data-score-board></div>
        <button data-next-button hidden></button>
      </section>

      <section class="panel compact room-settings" data-role-settings>
        <h2 data-i18n="roleSetupTitle"></h2>
        <div class="winning-score-settings" data-winning-score-settings></div>
        <div class="mode-options" data-role-mode-options></div>
        <div class="fixed-config" data-fixed-config></div>
        <button type="button" class="secondary reset-config-button" data-reset-config hidden></button>
        <p class="muted" data-role-mode-note></p>
      </section>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
