<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FF6B35">
  <title>🇳🇱 荷蘭語造句練習</title>
<style>
:root {
  --orange: #FF6B35;
  --orange-dark: #e55a25;
  --blue: #21468B;
  --blue-light: #e8f0fe;
  --green: #2ECC71;
  --red: #E74C3C;
  --gray-light: #f4f5f7;
  --gray-mid: #dde0e8;
  --text-dark: #1a1a2e;
  --text-mid: #555;
  --text-light: #888;
  --radius: 14px;
  --shadow: 0 4px 20px rgba(0,0,0,0.10);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; height: 100dvh; }
body {
  height: 100%; height: 100dvh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
  background: #f0f2f8;
  color: var(--text-dark);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overflow: hidden;
  overscroll-behavior: none;
}
button, a { touch-action: manipulation; }
.screen {
  display: none; flex-direction: column;
  height: 100dvh; overflow: hidden;
  animation: fadeIn .22s ease;
}
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

/* Home */
#screen-home { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: var(--safe-top); }
.home-header {
  background: linear-gradient(135deg, var(--orange) 0%, #ff8c5a 100%);
  color: #fff; text-align: center;
  padding: 32px 20px 28px;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 6px 24px rgba(255,107,53,0.28);
  flex-shrink: 0;
}
.home-logo { font-size: 48px; margin-bottom: 10px; }
.home-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
.home-subtitle { font-size: 14px; opacity: .85; margin-top: 5px; }
.level-badge {
  display: inline-block;
  background: rgba(255,255,255,0.22);
  border: 1px solid rgba(255,255,255,0.45);
  border-radius: 20px; font-size: 12px;
  padding: 4px 14px; margin-top: 12px; letter-spacing: .5px;
}
.categories-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px; padding: 20px 14px 8px;
}
.category-card {
  background: #fff; border-radius: var(--radius);
  padding: 18px 12px 14px; cursor: pointer;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
  border: none; text-align: left; width: 100%; min-height: 100px;
}
.category-card:active { transform: scale(.95); box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
.category-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--card-color, var(--orange));
  border-radius: var(--radius) var(--radius) 0 0;
}
.card-icon { font-size: 28px; margin-bottom: 7px; display: block; }
.card-name { font-size: 14px; font-weight: 700; color: var(--text-dark); line-height: 1.3; }
.card-nl { font-size: 11px; color: var(--text-light); margin-top: 3px; }
.card-count { font-size: 11px; color: var(--text-mid); margin-top: 8px; font-weight: 500; }
.home-tip { text-align: center; color: var(--text-light); font-size: 13px; padding: 12px 0 calc(28px + var(--safe-bottom)); }

/* Exercise */
#screen-exercise { height: 100dvh; overflow: hidden; padding-top: var(--safe-top); }
.ex-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px 10px; background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06); flex-shrink: 0; z-index: 10;
}
.btn-icon {
  background: var(--gray-light); border: none; border-radius: 10px;
  width: 44px; height: 44px; font-size: 20px; cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  color: var(--text-dark);
}
.btn-icon:active { background: var(--gray-mid); }
.ex-meta { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ex-category-label { font-size: 13px; font-weight: 600; color: var(--text-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress-track { height: 6px; background: var(--gray-mid); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--orange); border-radius: 3px; width: 0%; transition: width .4s ease; }
.streak-badge { background: #fff3e0; color: #e65100; font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 20px; flex-shrink: 0; white-space: nowrap; }

.ex-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 12px 14px calc(90px + var(--safe-bottom));
  display: flex; flex-direction: column; gap: 12px;
}
.ex-counter-row { text-align: right; }
.ex-counter { font-size: 12px; color: var(--text-light); font-weight: 500; }
.prompt-card { background: var(--blue); border-radius: var(--radius); padding: 18px; color: #fff; flex-shrink: 0; }
.prompt-label { font-size: 11px; opacity: .6; letter-spacing: .8px; text-transform: uppercase; margin-bottom: 6px; }
.chinese-prompt { font-size: 21px; font-weight: 700; line-height: 1.45; }
.answer-zone { background: #fff; border-radius: var(--radius); padding: 14px; min-height: 76px; box-shadow: var(--shadow); flex-shrink: 0; }
.answer-zone-label { font-size: 11px; color: var(--text-light); letter-spacing: .8px; text-transform: uppercase; margin-bottom: 8px; }
.answer-words { display: flex; flex-wrap: wrap; gap: 7px; min-height: 44px; align-items: flex-start; align-content: flex-start; }
.answer-words:empty::after { content: attr(data-placeholder); color: var(--text-light); font-size: 14px; line-height: 44px; }

.word-chip {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 8px 14px; border-radius: 10px;
  font-size: 17px; font-weight: 500; cursor: pointer; border: none;
  user-select: none; -webkit-user-select: none; line-height: 1.2;
  transition: transform .08s, opacity .1s;
}
.word-chip:active { transform: scale(.90); opacity: .85; }
.word-chip.in-bank { background: #fff; color: var(--text-dark); border: 2px solid var(--gray-mid); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
.word-chip.in-answer { background: var(--orange); color: #fff; border: 2px solid var(--orange-dark); }
.word-chip.hint-chip { background: #fff3cd; border: 2px solid #ffc107; color: #7a5c00; }
.word-bank { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0; }

.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; gap: 8px; background: #fff;
  border-top: 1px solid var(--gray-mid);
  box-shadow: 0 -4px 16px rgba(0,0,0,0.07);
  padding: 10px 14px calc(10px + var(--safe-bottom));
  z-index: 20;
}
.btn-soft {
  flex: 1; min-height: 52px; padding: 10px 4px;
  border: 2px solid var(--gray-mid); background: var(--gray-light);
  border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--text-mid); cursor: pointer;
}
.btn-soft:active { background: var(--gray-mid); transform: scale(.97); }
.btn-soft:disabled { opacity: .4; }
.btn-check {
  flex: 2; min-height: 52px; padding: 12px;
  background: var(--orange); color: #fff; border: none;
  border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
}
.btn-check:active { background: var(--orange-dark); transform: scale(.97); }
.btn-check:disabled { background: var(--gray-mid); color: var(--text-light); }

/* Feedback */
.feedback-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: flex-end;
  background: rgba(0,0,0,0.45); animation: overlayIn .18s ease;
}
.feedback-overlay.hidden { display: none; }
@keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
.feedback-panel {
  width: 100%; background: #fff; border-radius: 24px 24px 0 0;
  padding: 24px 20px calc(24px + var(--safe-bottom));
  animation: slideUp .22s ease; max-height: 80dvh;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
@keyframes slideUp { from { transform:translateY(50px); opacity:0; } to { transform:none; opacity:1; } }
.feedback-panel::before {
  content: ''; display: block; width: 36px; height: 4px;
  background: var(--gray-mid); border-radius: 2px; margin: 0 auto 18px;
}
.feedback-panel.correct { border-top: 5px solid var(--green); }
.feedback-panel.wrong   { border-top: 5px solid var(--red); }
.feedback-icon { font-size: 36px; margin-bottom: 6px; }
.feedback-msg { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
.feedback-panel.correct .feedback-msg { color: var(--green); }
.feedback-panel.wrong   .feedback-msg { color: var(--red); }
.answer-reveal { background: var(--gray-light); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.answer-reveal-label { font-size: 11px; color: var(--text-light); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }
.correct-sentence { font-size: 20px; font-weight: 700; color: var(--blue); line-height: 1.45; }
.tip-box { background: #fff8e1; border-left: 3px solid #ffc107; border-radius: 0 10px 10px 0; padding: 10px 13px; font-size: 14px; color: #5d4037; line-height: 1.55; margin-bottom: 18px; }
.tip-box:empty { display: none; }
.btn-next { width: 100%; min-height: 54px; background: var(--blue); color: #fff; border: none; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; letter-spacing: .3px; }
.btn-next:active { background: #1a3a7a; transform: scale(.98); }

/* Completion */
#screen-completion { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
.completion-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px calc(40px + var(--safe-bottom)); text-align: center; min-height: 100dvh; }
.completion-trophy { font-size: 68px; margin-bottom: 14px; animation: bounce .9s ease; }
@keyframes bounce { 0%,100%{transform:translateY(0);} 40%{transform:translateY(-18px);} 60%{transform:translateY(-9px);} }
.completion-title { font-size: 26px; font-weight: 700; }
.completion-sub { font-size: 15px; color: var(--text-mid); margin-top: 5px; }
.completion-stats { background: #fff; border-radius: var(--radius); padding: 22px 28px; margin: 24px 0; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; }
.stat-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stat-label { font-size: 14px; color: var(--text-mid); }
.stat-value { font-size: 22px; font-weight: 700; }
.stat-value.good { color: var(--green); }
.stat-value.ok   { color: var(--orange); }
.completion-actions { display: flex; flex-direction: column; width: 100%; max-width: 320px; }
.completion-actions .btn-check { min-height: 54px; font-size: 16px; border-radius: 14px; }
.completion-actions .btn-soft  { min-height: 50px; font-size: 15px; border-radius: 14px; border-color: var(--gray-mid); margin-top: 12px; }

@media (min-width: 480px) {
  .categories-grid { grid-template-columns: repeat(3, 1fr); padding: 22px 18px 8px; }
}
@media (min-width: 640px) {
  .categories-grid { grid-template-columns: repeat(4, 1fr); max-width: 680px; margin: 0 auto; }
  .ex-scroll { padding: 16px 20px calc(90px + var(--safe-bottom)); }
  .action-bar { padding: 12px 20px calc(12px + var(--safe-bottom)); }
  .feedback-panel { max-width: 480px; margin: 0 auto; border-radius: 24px; }
  .feedback-overlay { align-items: center; }
}
</style>
</head>
<body>

  <div id="screen-home" class="screen active">
    <header class="home-header">
      <div class="home-logo">🇳🇱</div>
      <h1 class="home-title">荷蘭語造句練習</h1>
      <p class="home-subtitle">每天10分鐘，開口說荷蘭語</p>
      <div class="level-badge">A1–A2 日常生活</div>
    </header>
    <div id="categories-grid" class="categories-grid"></div>
    <p class="home-tip">點擊主題開始練習 👆</p>
  </div>

  <div id="screen-exercise" class="screen">
    <header class="ex-header">
      <button id="btn-back" class="btn-icon">←</button>
      <div class="ex-meta">
        <span id="ex-category-label" class="ex-category-label"></span>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <div id="streak-badge" class="streak-badge">🔥 0</div>
    </header>
    <div class="ex-scroll">
      <div class="ex-counter-row"><span id="ex-counter" class="ex-counter"></span></div>
      <div class="prompt-card">
        <div class="prompt-label">中文</div>
        <div id="chinese-prompt" class="chinese-prompt"></div>
      </div>
      <div class="answer-zone">
        <div class="answer-zone-label">你的答案</div>
        <div id="answer-words" class="answer-words" data-placeholder="點擊下方單字來組句"></div>
      </div>
      <div id="word-bank" class="word-bank"></div>
    </div>
    <div class="action-bar">
      <button id="btn-hint" class="btn-soft">💡 提示</button>
      <button id="btn-clear" class="btn-soft">↩ 清除</button>
      <button id="btn-check" class="btn-check" disabled>確認 ✓</button>
    </div>
  </div>

  <div id="feedback-overlay" class="feedback-overlay hidden">
    <div id="feedback-panel" class="feedback-panel">
      <div id="feedback-icon" class="feedback-icon"></div>
      <div id="feedback-msg" class="feedback-msg"></div>
      <div class="answer-reveal">
        <div class="answer-reveal-label">正確荷蘭語</div>
        <div id="correct-sentence" class="correct-sentence"></div>
      </div>
      <div id="tip-box" class="tip-box"></div>
      <button id="btn-next" class="btn-next">下一句 →</button>
    </div>
  </div>

  <div id="screen-completion" class="screen">
    <div class="completion-wrap">
      <div class="completion-trophy">🏆</div>
      <h2 class="completion-title">練習完成！</h2>
      <p class="completion-sub" id="completion-category"></p>
      <div id="completion-stats" class="completion-stats"></div>
      <div class="completion-actions">
        <button id="btn-retry" class="btn-check">再練一次 🔁</button>
        <button id="btn-home" class="btn-soft">← 回首頁</button>
      </div>
    </div>
  </div>

<script>
const CATEGORIES = [
  {
    id: "greetings", name_zh: "打招呼與介紹", name_nl: "Begroetingen", icon: "👋", color: "#FF6B35",
    sentences: [
      { dutch: "Hoe heet jij?", chinese: "你叫什麼名字？", words: ["Hoe", "heet", "jij"], distractors: ["Ben", "Wat", "heeft", "naam"], tip: "🔑 問句結構：疑問詞 → 動詞 → 主詞。Hoe = 怎麼，heet = 叫做" },
      { dutch: "Ik heet Gordon.", chinese: "我叫 Gordon。", words: ["Ik", "heet", "Gordon"], distractors: ["Ben", "heb", "naam", "is"], tip: "🔑 heet 是動詞 heten（叫做）的現在式" },
      { dutch: "Hoe gaat het?", chinese: "你好嗎？（近況如何？）", words: ["Hoe", "gaat", "het"], distractors: ["Wat", "is", "ben", "goed"], tip: "🔑 最常見的荷蘭語問候，字面「它進行得怎樣？」" },
      { dutch: "Goed, dank je wel.", chinese: "很好，謝謝你。", words: ["Goed", "dank", "je", "wel"], distractors: ["Prima", "niet", "ook", "maar"], tip: "🔑 dank je wel = 謝謝（非正式），正式版是 dank u wel" },
      { dutch: "Goedemorgen!", chinese: "早安！", words: ["Goedemorgen"], distractors: ["Goedemiddag", "Goedenavond", "Welterusten"], tip: "🔑 荷蘭語問候分時段：morgen（早）/ middag（午）/ avond（晚）" },
      { dutch: "Goedenavond!", chinese: "晚安！（晚上好）", words: ["Goedenavond"], distractors: ["Goedemorgen", "Welterusten", "Slaapwel"], tip: "🔑 Welterusten 是「睡個好覺」，Goedenavond 是晚上見面時說的" },
      { dutch: "Tot ziens!", chinese: "再見！", words: ["Tot", "ziens"], distractors: ["Dag", "morgen", "straks", "later"], tip: "🔑 tot = 直到，ziens = 看見；字面「直到再見到你」" },
      { dutch: "Doei!", chinese: "掰掰！（非正式）", words: ["Doei"], distractors: ["Dag", "Tot", "ziens", "later"], tip: "🔑 口語再見，非常常用，相當於英文 Bye！" },
      { dutch: "Ik kom uit Taiwan.", chinese: "我來自台灣。", words: ["Ik", "kom", "uit", "Taiwan"], distractors: ["ben", "woon", "van", "ga"], tip: "🔑 komen uit = 來自；wonen in = 居住在" },
      { dutch: "Ik woon in Amsterdam.", chinese: "我住在阿姆斯特丹。", words: ["Ik", "woon", "in", "Amsterdam"], distractors: ["kom", "ben", "ga", "naar"], tip: "🔑 wonen = 居住，表示目前定居地點" },
      { dutch: "Ik spreek een beetje Nederlands.", chinese: "我說一點點荷蘭語。", words: ["Ik", "spreek", "een", "beetje", "Nederlands"], distractors: ["leer", "goed", "vloeiend", "lees", "Engels"], tip: "🔑 een beetje = 一點點，這句超常用！不要害羞說出來" },
      { dutch: "Kunt u dat herhalen?", chinese: "您可以再說一遍嗎？", words: ["Kunt", "u", "dat", "herhalen"], distractors: ["Kan", "jij", "dit", "zeggen", "nog"], tip: "🔑 u 是 jij 的正式版，與長輩或不熟的人說話時使用" },
      { dutch: "Spreekt u Engels?", chinese: "您會說英語嗎？", words: ["Spreekt", "u", "Engels"], distractors: ["Kunt", "jij", "Duits", "Frans", "praat"], tip: "🔑 荷蘭人英語通常很好！語言困難時這句很有用" },
      { dutch: "Aangenaam kennis te maken.", chinese: "很高興認識您。", words: ["Aangenaam", "kennis", "te", "maken"], distractors: ["Prettig", "leuk", "ontmoeten", "blij", "Goed"], tip: "🔑 kennis maken = 認識（某人），較正式的說法" },
      { dutch: "Tot morgen!", chinese: "明天見！", words: ["Tot", "morgen"], distractors: ["ziens", "later", "straks", "volgende", "week"], tip: "🔑 tot + 時間 = ...見。例如：Tot straks（待會見）、Tot maandag（週一見）" },
    ]
  },
  {
    id: "time", name_zh: "時間與日期", name_nl: "Tijd & Datum", icon: "🕐", color: "#9B59B6",
    sentences: [
      { dutch: "Hoe laat is het?", chinese: "現在幾點？", words: ["Hoe", "laat", "is", "het"], distractors: ["Wat", "tijd", "zijn", "uur"], tip: "🔑 laat = 晚/時，Hoe laat 字面「多晚了？」就是問時間" },
      { dutch: "Het is drie uur.", chinese: "現在三點鐘。", words: ["Het", "is", "drie", "uur"], distractors: ["zijn", "vier", "half", "laat"], tip: "🔑 uur = 小時，數字 + uur 表示整點" },
      { dutch: "Het is half vier.", chinese: "現在三點半。", words: ["Het", "is", "half", "vier"], distractors: ["drie", "kwart", "uur", "vijf"], tip: "🔑 陷阱！half vier = 「四點的一半」= 三點半，不是四點半" },
      { dutch: "Het is kwart over drie.", chinese: "現在三點十五分。", words: ["Het", "is", "kwart", "over", "drie"], distractors: ["voor", "half", "tien", "vier", "uur"], tip: "🔑 kwart over = 過一刻，kwart voor = 差一刻" },
      { dutch: "Hoe oud ben jij?", chinese: "你幾歲？", words: ["Hoe", "oud", "ben", "jij"], distractors: ["Wat", "jaar", "heet", "is", "groot"], tip: "🔑 oud = 老的/歲，ben 是 zijn（是）對 jij 的變化" },
      { dutch: "Ik ben dertig jaar oud.", chinese: "我三十歲。", words: ["Ik", "ben", "dertig", "jaar", "oud"], distractors: ["heb", "twintig", "woon", "lang", "groot"], tip: "🔑 twintig(20) dertig(30) veertig(40) vijftig(50)" },
      { dutch: "Vandaag is het maandag.", chinese: "今天是星期一。", words: ["Vandaag", "is", "het", "maandag"], distractors: ["Morgen", "zijn", "vrijdag", "woensdag", "dinsdag"], tip: "🔑 maandag一 dinsdag二 woensdag三 donderdag四 vrijdag五" },

const WRONG_MSGS  = ["再試試看！💪", "沒關係，繼續練習！", "快了！加油！🔥", "這句有點難，記起來！"];

class DutchApp {
  constructor() {
    this.currentCategory = null;
    this.sentences = [];
    this.index = 0;
    this.score = 0;
    this.streak = 0;
    this.maxStreak = 0;
    this.selectedWords = [];
    this.bankWords = [];
    this.hintUsed = false;
    this.init();
  }
  init() {
    this.bindGlobal();
    this.renderHome();
  }
  bindGlobal() {
    document.getElementById("btn-back").onclick   = () => this.showHome();
    document.getElementById("btn-hint").onclick   = () => this.useHint();
    document.getElementById("btn-clear").onclick  = () => this.clearAnswer();
    document.getElementById("btn-check").onclick  = () => this.checkAnswer();
    document.getElementById("btn-next").onclick   = () => this.nextSentence();
    document.getElementById("btn-retry").onclick  = () => this.startCategory(this.currentCategory.id);
    document.getElementById("btn-home").onclick   = () => this.showHome();
  }
  renderHome() {
    this.showScreen("home");
    const grid = document.getElementById("categories-grid");
    grid.innerHTML = CATEGORIES.map(c => `
      <button class="category-card" style="--card-color:${c.color}" data-id="${c.id}">
        <span class="card-icon">${c.icon}</span>
        <div class="card-name">${c.name_zh}</div>
        <div class="card-nl">${c.name_nl}</div>
        <div class="card-count">${c.sentences.length} 句</div>
      </button>`).join("");
    grid.querySelectorAll(".category-card").forEach(btn =>
      btn.onclick = () => this.startCategory(btn.dataset.id));
  }
  startCategory(id) {
    this.currentCategory = CATEGORIES.find(c => c.id === id);
    if (!this.currentCategory) return;
    this.sentences = this.shuffle([...this.currentCategory.sentences]);
    this.index = 0; this.score = 0; this.streak = 0; this.maxStreak = 0;
    this.showScreen("exercise");
    document.getElementById("ex-category-label").textContent =
      `${this.currentCategory.icon} ${this.currentCategory.name_zh}`;
    this.renderSentence();
  }
  renderSentence() {
    const s = this.sentences[this.index];
    this.hintUsed = false;
    this.selectedWords = [];
    this.bankWords = this.shuffle([...s.words, ...(s.distractors || [])]).map((w, i) => ({ word: w, id: i }));
    document.getElementById("chinese-prompt").textContent = s.chinese;
    document.getElementById("ex-counter").textContent = `第 ${this.index + 1} / ${this.sentences.length} 句`;
    document.getElementById("progress-fill").style.width = `${(this.index / this.sentences.length) * 100}%`;
    document.getElementById("streak-badge").textContent = `🔥 ${this.streak}`;
    document.getElementById("btn-check").disabled = true;
    document.getElementById("btn-hint").textContent = "💡 提示";
    document.getElementById("btn-hint").disabled = false;
    this.renderAnswerArea();
    this.renderWordBank();
  }
  renderAnswerArea() {
    const el = document.getElementById("answer-words");
    el.innerHTML = this.selectedWords.map((item, i) =>
      `<button class="word-chip in-answer" data-idx="${i}">${item.word}</button>`).join("");
    el.querySelectorAll(".word-chip").forEach(btn =>
      btn.onclick = () => this.removeWord(parseInt(btn.dataset.idx)));
    document.getElementById("btn-check").disabled = this.selectedWords.length === 0;
  }
  renderWordBank() {
    const el = document.getElementById("word-bank");
    el.innerHTML = this.bankWords.map((item, i) =>
      `<button class="word-chip in-bank${item.hint ? " hint-chip" : ""}" data-idx="${i}">${item.word}</button>`).join("");
    el.querySelectorAll(".word-chip").forEach(btn =>
      btn.onclick = () => this.addWord(parseInt(btn.dataset.idx)));
  }
  addWord(bankIdx) {
    const item = this.bankWords[bankIdx];
    if (!item) return;
    this.selectedWords.push(item);
    this.bankWords.splice(bankIdx, 1);
    this.renderAnswerArea(); this.renderWordBank();
  }
  removeWord(answerIdx) {
    const item = this.selectedWords[answerIdx];
    if (!item) return;
    this.selectedWords.splice(answerIdx, 1);
    this.bankWords.push(item);
    this.renderAnswerArea(); this.renderWordBank();
  }
  clearAnswer() {
    this.bankWords = [...this.bankWords, ...this.selectedWords];
    this.selectedWords = [];
    this.renderAnswerArea(); this.renderWordBank();
  }
  useHint() {
    if (this.hintUsed) return;
    const firstWord = this.sentences[this.index].words[0];
    const idx = this.bankWords.findIndex(item => item.word === firstWord);
    if (idx === -1) return;
    this.hintUsed = true;
    this.bankWords[idx].hint = true;
    this.renderWordBank();
    document.getElementById("btn-hint").textContent = "💡 (已用)";
    document.getElementById("btn-hint").disabled = true;
  }
  checkAnswer() {
    const s = this.sentences[this.index];
    const user    = this.selectedWords.map(i => i.word.toLowerCase());
    const correct = s.words.map(w => w.toLowerCase());
    const isCorrect = JSON.stringify(user) === JSON.stringify(correct);
    if (isCorrect) { this.score++; this.streak++; this.maxStreak = Math.max(this.maxStreak, this.streak); }
    else { this.streak = 0; }
    document.getElementById("streak-badge").textContent = `🔥 ${this.streak}`;
    this.showFeedback(isCorrect, s);
  }
  showFeedback(isCorrect, s) {
    const panel = document.getElementById("feedback-panel");
    panel.className = `feedback-panel ${isCorrect ? "correct" : "wrong"}`;
    document.getElementById("feedback-icon").textContent = isCorrect ? "✅" : "❌";
    document.getElementById("feedback-msg").textContent  = isCorrect
      ? CORRECT_MSGS[Math.floor(Math.random() * CORRECT_MSGS.length)]
      : WRONG_MSGS[Math.floor(Math.random() * WRONG_MSGS.length)];
    document.getElementById("correct-sentence").textContent = s.dutch;
    const tip = document.getElementById("tip-box");
    tip.textContent = s.tip || "";
    tip.style.display = s.tip ? "" : "none";
    document.getElementById("feedback-overlay").classList.remove("hidden");
  }
  nextSentence() {
    document.getElementById("feedback-overlay").classList.add("hidden");
    this.index++;
    if (this.index >= this.sentences.length) this.showCompletion();
    else this.renderSentence();
  }
  showCompletion() {
    this.showScreen("completion");
    const total = this.sentences.length;
    const pct   = Math.round((this.score / total) * 100);
    const grade = pct >= 80 ? "good" : pct >= 50 ? "ok" : "";
    document.getElementById("completion-category").textContent =
      `${this.currentCategory.icon} ${this.currentCategory.name_zh}`;
    document.getElementById("completion-stats").innerHTML = `
      <div class="stat-row"><span class="stat-label">答對題數</span><span class="stat-value ${grade}">${this.score} / ${total}</span></div>
      <div class="stat-row"><span class="stat-label">正確率</span><span class="stat-value ${grade}">${pct}%</span></div>
      <div class="stat-row"><span class="stat-label">最長連勝</span><span class="stat-value">${this.maxStreak} 句 🔥</span></div>`;
  }
  showScreen(name) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(`screen-${name}`).classList.add("active");
  }
  shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
}

document.addEventListener("DOMContentLoaded", () => new DutchApp());
</script>
</body>
</html>
