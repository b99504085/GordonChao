<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生活小細節</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f5f5f7; color: #1d1d1f; min-height: 100dvh; }

      /* Header */
      header {
        background: #fff;
        border-bottom: 1px solid #e5e5e7;
        padding: 14px 16px 10px;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      header h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
      .search-row { display: flex; gap: 8px; align-items: center; }
      .search-row input {
        flex: 1;
        padding: 9px 12px;
        border: 1px solid #d1d1d6;
        border-radius: 10px;
        font-size: 15px;
        background: #f5f5f7;
        outline: none;
        -webkit-appearance: none;
      }
      .search-row input:focus { border-color: #555; background: #fff; }

      /* Category pills */
      .cats {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 16px;
        background: #fff;
        border-bottom: 1px solid #e5e5e7;
        scrollbar-width: none;
      }
      .cats::-webkit-scrollbar { display: none; }
      .cat-btn {
        padding: 6px 14px;
        border: 1.5px solid #d1d1d6;
        border-radius: 20px;
        background: #fff;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        font-family: inherit;
      }
      .cat-btn.active { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }

      /* Cards */
      .cards {
        padding: 14px 16px 100px;
        display: grid;
        gap: 12px;
      }
      @media (min-width: 580px) { .cards { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 860px) { .cards { grid-template-columns: repeat(3, 1fr); } }

      .card {
        background: #fff;
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        cursor: pointer;
        transition: box-shadow 0.15s, transform 0.1s;
      }
      .card:active { transform: scale(0.98); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
      .card-cat { font-size: 12px; color: #888; margin-bottom: 4px; }
      .card-title { font-weight: 600; font-size: 16px; margin-bottom: 6px; line-height: 1.3; }
      .card-content {
        font-size: 14px;
        color: #555;
        line-height: 1.6;
        white-space: pre-wrap;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-date { font-size: 11px; color: #c0c0c5; margin-top: 10px; }

      .empty { text-align: center; padding: 60px 24px; color: #aaa; grid-column: 1/-1; }
      .empty p { font-size: 15px; margin-top: 8px; }

      /* FAB */
      .fab {
        position: fixed;
        bottom: 28px;
        right: 20px;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #1d1d1f;
        color: #fff;
        font-size: 28px;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        z-index: 30;
        transition: transform 0.1s;
      }
      .fab:active { transform: scale(0.92); }

      /* Modal overlay */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 50;
        align-items: flex-end;
        justify-content: center;
      }
      .overlay.open { display: flex; }
      @media (min-width: 600px) { .overlay { align-items: center; } }

      .modal {
        background: #fff;
        border-radius: 22px 22px 0 0;
        padding: 20px 18px 36px;
        width: 100%;
        max-height: 88dvh;
        overflow-y: auto;
      }
      @media (min-width: 600px) {
        .modal { border-radius: 18px; max-width: 480px; max-height: 90dvh; }
      }

      .modal-handle { width: 40px; height: 4px; background: #d1d1d6; border-radius: 2px; margin: 0 auto 16px; }
      .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 18px; }

      .form-group { margin-bottom: 14px; }
      .form-group label { display: block; font-size: 13px; color: #666; font-weight: 500; margin-bottom: 6px; }
      .form-group input[type=text],
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 11px 13px;
        border: 1.5px solid #d1d1d6;
        border-radius: 10px;
        font-size: 15px;
        font-family: inherit;
        color: #1d1d1f;
        background: #fff;
        -webkit-appearance: none;
        outline: none;
        transition: border-color 0.15s;
      }
      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus { border-color: #1d1d1f; }
      .form-group textarea { min-height: 110px; resize: vertical; line-height: 1.5; }

      .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
      .modal-actions button {
        flex: 1;
        padding: 13px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        font-family: inherit;
        transition: opacity 0.15s;
      }
      .modal-actions button:active { opacity: 0.75; }
      .btn-save { background: #1d1d1f; color: #fff; }
      .btn-cancel { background: #f0f0f2; color: #1d1d1f; }
      .btn-delete { background: #fff0f0; color: #d63031; flex: 0 0 auto; padding-left: 14px; padding-right: 14px; }
    </style>
  </head>
  <body>
    <header>
      <h1>📝 生活小細節</h1>
      <div class="search-row">
        <input id="search" type="search" placeholder="搜尋關鍵字…" autocomplete="off" />
      </div>
    </header>

    <div class="cats" id="cats">
      <button class="cat-btn active" data-cat="">全部</button>
      <button class="cat-btn" data-cat="🍳 料理">🍳 料理</button>
      <button class="cat-btn" data-cat="🏠 家事">🏠 家事</button>
      <button class="cat-btn" data-cat="🛒 購物">🛒 購物</button>
      <button class="cat-btn" data-cat="👨‍👩‍👧 家人喜好">👨‍👩‍👧 家人喜好</button>
      <button class="cat-btn" data-cat="📝 其他">📝 其他</button>
    </div>

    <main class="cards" id="cards"></main>

    <button class="fab" id="addBtn" title="新增細節">+</button>

    <div class="overlay" id="overlay">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-handle"></div>
        <h2 id="modalTitle">新增細節</h2>
        <input type="hidden" id="editId" />

        <div class="form-group">
          <label for="fieldTitle">標題</label>
          <input type="text" id="fieldTitle" placeholder="例：白菜的切法" maxlength="60" />
        </div>

        <div class="form-group">
          <label for="fieldContent">內容</label>
          <textarea id="fieldContent" placeholder="例：白菜要切約 2 公分寬，太細容易出水變軟爛。"></textarea>
        </div>

        <div class="form-group">
          <label for="fieldCat">分類</label>
          <select id="fieldCat">
            <option value="🍳 料理">🍳 料理</option>
            <option value="🏠 家事">🏠 家事</option>
            <option value="🛒 購物">🛒 購物</option>
            <option value="👨‍👩‍👧 家人喜好">👨‍👩‍👧 家人喜好</option>
            <option value="📝 其他">📝 其他</option>
          </select>
        </div>

        <div class="modal-actions">
          <button class="btn-cancel" id="cancelBtn" type="button">取消</button>
          <button class="btn-delete" id="deleteBtn" type="button" style="display:none">刪除</button>
          <button class="btn-save" id="saveBtn" type="button">儲存</button>
        </div>
      </div>
    </div>

    <script>
      let memories = [];
      let activeCat = "";
      let searchQ = "";

      async function load() {
        try {
          const res = await fetch("/api/memories");
          const data = await res.json();
          memories = data.memories || [];
        } catch {
          memories = [];
        }
        render();
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function formatDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")} 更新`;
      }

      function render() {
        const q = searchQ.trim().toLowerCase();
        const filtered = memories.filter((m) => {
          const catOk = !activeCat || m.category === activeCat;
          const searchOk =
            !q ||
            m.title.toLowerCase().includes(q) ||
            m.content.toLowerCase().includes(q);
          return catOk && searchOk;
        });

        const container = document.getElementById("cards");
        if (!filtered.length) {
          container.innerHTML =
            '<div class="empty"><div style="font-size:40px">🗒️</div><p>' +
            (q || activeCat ? "沒有符合的記錄" : "還沒有任何記錄，按 + 新增第一筆！") +
            "</p></div>";
          return;
        }

        container.innerHTML = filtered
          .map(
            (m) => `
          <div class="card" data-id="${m.id}">
            <div class="card-cat">${esc(m.category)}</div>
            <div class="card-title">${esc(m.title)}</div>
            <div class="card-content">${esc(m.content)}</div>
            <div class="card-date">${formatDate(m.updatedAt || m.createdAt)}</div>
          </div>`
          )
          .join("");

        container.querySelectorAll(".card").forEach((card) => {
          card.addEventListener("click", () => openEdit(card.dataset.id));
        });
      }

      document.getElementById("search").addEventListener("input", (e) => {
        searchQ = e.target.value;
        render();
      });

      document.getElementById("cats").addEventListener("click", (e) => {
        const btn = e.target.closest(".cat-btn");
        if (!btn) return;
        document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeCat = btn.dataset.cat;
        render();
      });

      function openModal(title, memory) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("editId").value = memory?.id || "";
        document.getElementById("fieldTitle").value = memory?.title || "";
        document.getElementById("fieldContent").value = memory?.content || "";
        document.getElementById("fieldCat").value = memory?.category || "🍳 料理";
        document.getElementById("deleteBtn").style.display = memory ? "" : "none";
        document.getElementById("overlay").classList.add("open");
        setTimeout(() => document.getElementById("fieldTitle").focus(), 100);
      }

      function closeModal() {
        document.getElementById("overlay").classList.remove("open");
      }

      function openEdit(memId) {
        const m = memories.find((x) => x.id === memId);
        if (m) openModal("編輯細節", m);
      }

      document.getElementById("addBtn").addEventListener("click", () => openModal("新增細節", null));
      document.getElementById("cancelBtn").addEventListener("click", closeModal);
      document.getElementById("overlay").addEventListener("click", (e) => {
        if (e.target === document.getElementById("overlay")) closeModal();
      });

      document.getElementById("saveBtn").addEventListener("click", async () => {
        const memId = document.getElementById("editId").value;
        const body = {
          title: document.getElementById("fieldTitle").value.trim(),
          content: document.getElementById("fieldContent").value.trim(),
          category: document.getElementById("fieldCat").value,
        };
        if (!body.title) { alert("請填寫標題"); return; }
        if (!body.content) { alert("請填寫內容"); return; }
        if (memId) body.id = memId;

        const url = memId ? "/api/memories/update" : "/api/memories";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.error) { alert(data.error); return; }
        memories = data.memories || [];
        closeModal();
        render();
      });

      document.getElementById("deleteBtn").addEventListener("click", async () => {
        const memId = document.getElementById("editId").value;
        if (!memId || !confirm("確定要刪除這筆記錄嗎？")) return;
        const res = await fetch("/api/memories/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: memId }),
        });
        const data = await res.json();
        if (data.error) { alert(data.error); return; }
        memories = data.memories || [];
        closeModal();
        render();
      });

      load();
    </script>
  </body>
</html>
